[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: every route falls back to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Models and animation clips are content-addressed by the Vite build only for
# bundled assets; /models and /animations are served from /public unhashed, so
# cache them for a day rather than forever.
[[headers]]
  for = "/models/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/animations/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Config JSON must never be stale — it is the tuning surface.
[[headers]]
  for = "/config/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
