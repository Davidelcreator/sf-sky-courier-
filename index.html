<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sky Fighter</title>
  <!-- viewport-fit=cover + maximum-scale=1 stop phones zooming or letterboxing
       the canvas while you play. user-scalable=no kills the double-tap zoom
       that otherwise fires when you mash the attack buttons. -->
  <meta name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d17">
  <meta name="description" content="A 2.5D browser fighting game — three-phase procedural animation, real frame data, touch and gamepad ready.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥊</text></svg>">
  <link rel="stylesheet" href="./src/ui/style.css">
</head>
<body>
  <!-- The renderer owns this element; everything else is a DOM overlay on top. -->
  <div id="stage">
    <canvas id="game-canvas"></canvas>
    <div id="ui-root"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
